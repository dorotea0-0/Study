<html>

<head>
    <meta charse="UTF-8">
    <title>Кофе</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <div class="heart">&#x2661;</div>

    <div class="container">
        <img scr="cofe.webp" alt="Koфе">

        <h1>БРАЗИЛИЯ ЖЕЛТЫЙ БУРБОН</h1>
        <p>Идеально с молоком, но черным тоже хорош</p>
        <p>500 р</p>

        <div class="option">
            <label>Все пачки</label>
            <input type="radio" id="w200" name="weight" value="200" checked>
            <label for="w200">200 гр</label>
            <input type="radio" id="w500" name="weight" value="500">
            <label for="w500">500 гр.</label>
        </div>

        <div class="option">
            <label>Степень помола</label>
            <select>
                <option>Не молоть</option>
                <option>Мелкий помол</option>
                <option>Средний помол</option>
                <option>Крупный помол</option>
            </select>
        </div>

        <div class="actions">
            <div class="qty">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
            <button class="cart">В корзину</button>
        </div>
        <button class="more">Подробнее</button>
    </div>
</body>

</html>
